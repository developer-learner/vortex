[project]
name = "vortex"
version = "0.1.0"
description = "Vortex — one place that owns every local LLM on this machine."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "psutil",
]

[project.scripts]
vortex = "modelmux.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]